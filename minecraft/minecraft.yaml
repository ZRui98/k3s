apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-datadir
  namespace: minecraft
  labels:
    app: minecraft
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-backupdir
  namespace: minecraft
  labels:
    app: minecraft
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: minecraft
  name: minecraft-server
  labels:
    app: minecraft
spec:
  serviceName: minecraft-server
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: type
                operator: In
                values:
                - compute
      containers:
      - name: minecraft
        image: itzg/minecraft-server:java17
        imagePullPolicy: IfNotPresent
        ports:
        - name: minecraft
          containerPort: 25565
          protocol: TCP
        env:
        - name: EULA
          value: "true"
        - name: ENABLE_WHITELIST
          value: "true"
        - name: ENFORCE_WHITELIST
          value: "true"
        - name: WHITELIST
          value: "dunkjog,EternalOverlord"
        - name: TYPE
          value: "FORGE"
        - name: VERSION
          value: "1.20.1"
        - name: FORGE_VERSION
          value: "47.4.13"
        - name: GENERIC_PACKS
          value: "TerraFirmaGreg-Modern-0.13.10-serverpack"
        - name: GENERIC_PACKS_PREFIX
          value: "https://github.com/TerraFirmaGreg-Team/Modpack-Modern/releases/download/0.13.10/"
        - name: GENERIC_PACKS_SUFFIX
          value: ".zip"
        - name: SKIP_GENERIC_PACK_UPDATE_CHECK
          value: "true"
        - name: LEVEL
          value: "tfg"
        - name: MEMORY
          value: "6G"
        resources:
          requests:
            memory: "7680Mi"
            cpu: "1"
          limits:
            memory: "7680Mi"
        volumeMounts:
        - mountPath: /data
          name: minecraft-datadir
        - mountPath: /backups
          name: minecraft-backupdir
      volumes:
      - name: minecraft-datadir
        persistentVolumeClaim:
          claimName: minecraft-datadir
      - name: minecraft-backupdir
        persistentVolumeClaim:
          claimName: minecraft-backupdir
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-server
  namespace: minecraft
  labels:
    app: minecraft
  annotations:
    mc-router.itzg.me/externalServerName: "mc.k8s.zrui.dev"
spec:
  type: ClusterIP
  selector:
    app: minecraft
  ports:
  - name: minecraft
    port: 25565
    targetPort: 25565
    protocol: TCP
